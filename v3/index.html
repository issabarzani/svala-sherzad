<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Noto+Kufi+Arabic:wght@500;700;900&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">

<style>
/* VOICE: an art magazine special issue — confident, airy, precise.
   IDEA: her portfolio as a printed edition: masthead, pull quotes, a cover image you zoom into, plates stacked like pages.
   PICTURE: a pinned cover that grows to fill the screen, then project plates stacking on top of each other.
   COLOUR and TYPE: bone paper #f2eee9, ink #17080f, magenta #d81b5a, plum #7a0a3e; Inter Tight + Newsreader italic; Noto Kufi + Noto Naskh Arabic.
   LAYOUT: masthead → kinetic name → zoom cover → stacked features → archive grid → essay about → services accordion → colophon contact. */
:root{--bg:#f2eee9;--paper:#fbf9f6;--ink:#17080f;--mute:#6b5a62;--line:rgba(23,8,15,.14);--mag:#d81b5a;--plum:#7a0a3e;--grad:linear-gradient(90deg,#7a0a3e,#ff3370);
--sv-bg:var(--bg);--sv-ink:var(--ink);--sv-mute:var(--mute);--sv-line:var(--line);--sv-acc:var(--mag);--sv-grad:var(--grad);color-scheme:light;
--fd:"Inter Tight","Noto Kufi Arabic",sans-serif;--fs:"Newsreader",Georgia,serif;--fb:"Inter Tight","Noto Naskh Arabic",system-ui,sans-serif}
[dir=rtl]{--fd:"Noto Kufi Arabic",sans-serif;--fs:"Noto Naskh Arabic",serif;--fb:"Noto Naskh Arabic","Noto Kufi Arabic",serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--fb);overflow-x:clip}
a{color:inherit}img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1;font-weight:900}
em,.serif{font-family:var(--fs);font-style:italic;font-weight:400}
[dir=rtl] em,[dir=rtl] .serif{font-style:normal}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
.pad{padding-inline:max(4vw,18px)}.wrap{max-width:1400px;margin:auto}
.curtain{position:fixed;inset:0;z-index:300;display:grid;grid-template-columns:repeat(5,1fr);pointer-events:none}
.curtain i{background:var(--plum)}.curtain i:nth-child(even){background:var(--mag)}

header{position:sticky;top:0;z-index:50;background:rgba(242,238,233,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:center;gap:16px;padding:12px max(4vw,18px);max-width:1400px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:900 17px "Inter Tight",sans-serif;letter-spacing:-.02em}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center}.brand img{height:20px}
.issue{font:500 13px "Inter Tight",sans-serif;color:var(--mute);border-inline-start:1px solid var(--line);padding-inline-start:14px}
nav{display:flex;margin-inline-start:auto}
nav a{text-decoration:none;padding:10px 12px;font-size:15px;font-family:var(--fd);font-weight:500;background:linear-gradient(var(--mag),var(--mag)) no-repeat 50% 85%/0 1.5px;transition:background-size .4s}
nav a:hover{background-size:calc(100% - 24px) 1.5px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font:700 15px var(--fd);white-space:nowrap;border:0;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:transform .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--mag);transform:translateY(101%);transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1;border-radius:inherit}
.btn:hover::before{transform:none}
.btn svg{width:18px;height:18px}
.btn.l{background:none;color:var(--ink);border:1.5px solid var(--ink)}.btn.l:hover{color:#fff}
@media(max-width:980px){nav,.issue{display:none}#lang{margin-inline-start:auto}}
@media(max-width:520px){header .btn span{display:none}header .btn{padding:0 13px}.brand b{display:none}}

/* hero */
.hero{padding-top:clamp(30px,5vw,60px);overflow:hidden}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:500 14px var(--fd);color:var(--mute);border-bottom:1px solid var(--ink);padding-bottom:12px}
.kin{font-size:clamp(70px,17.5vw,300px);letter-spacing:-.055em;line-height:.82;white-space:nowrap;direction:ltr}
[dir=rtl] .kin{letter-spacing:0;line-height:1.25;font-size:clamp(64px,15vw,250px)}
.kin .k1{display:block;padding-top:.08em}
.kin .k2{display:block;text-align:right;color:var(--mag)}
.kin .k2 em{color:var(--ink);font-size:.4em;letter-spacing:0;vertical-align:.9em;margin-right:.3em}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:end;border-top:1px solid var(--ink);padding-block:24px 40px;margin-top:10px}
.hgrid .role{font:700 20px/1.25 var(--fd)}
.hgrid .lead{font-family:var(--fs);font-size:clamp(20px,1.9vw,26px);line-height:1.35;margin:0}
[dir=rtl] .hgrid .lead{font-size:clamp(18px,1.6vw,22px);line-height:1.8}
.hgrid .ctas{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:900px){.hgrid{grid-template-columns:minmax(0,1fr)}.hgrid .ctas{justify-content:flex-start}}

/* zoom cover */
.zoom{height:100svh;position:relative;overflow:hidden;display:grid;place-items:center}
.zimg{position:absolute;width:34vw;aspect-ratio:4/3;border-radius:6px;overflow:hidden;will-change:transform}
.zimg img{width:100%;height:100%;object-fit:cover}
.zt{position:relative;z-index:2;font-size:clamp(44px,8vw,140px);letter-spacing:-.04em;display:flex;gap:.3em .35em;mix-blend-mode:difference;color:#fff;pointer-events:none;flex-wrap:wrap;justify-content:center;text-align:center;padding-inline:16px}
[dir=rtl] .zt{letter-spacing:0;font-size:clamp(38px,6.6vw,110px)}
.zt span{display:inline-block;will-change:transform}
@media(max-width:700px){.zimg{width:70vw}}

/* stacked features */
.feat{padding-block:clamp(60px,8vw,110px) 0}
.sec{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:16px;margin-bottom:30px}
.sec h2{font-size:clamp(40px,6vw,92px);letter-spacing:-.04em}
[dir=rtl] .sec h2{letter-spacing:0}
.sec p{max-width:46ch;margin:0;color:var(--mute)}
.stack{display:grid;gap:0}
.plate{position:sticky;top:90px;height:calc(100svh - 120px);min-height:520px;margin-bottom:5vh;border-radius:22px;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;transform-origin:50% 0;box-shadow:0 -20px 60px -30px rgba(23,8,15,.35)}
.plate figure{margin:0;overflow:hidden;position:relative}
.plate figure img{width:100%;height:100%;object-fit:cover;object-position:top;transform:scale(1.1)}
.plate .tx{padding:clamp(24px,3.4vw,52px);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.plate .no{font:500 14px var(--fd);color:var(--mute);display:flex;justify-content:space-between}
.plate h3{font-size:clamp(36px,4.6vw,76px);letter-spacing:-.04em;direction:ltr;text-align:start}
.plate .cat{font-family:var(--fs);font-size:22px;color:var(--mag);margin:10px 0 0}
.plate .open{align-self:flex-start}
@media(max-width:820px){.plate{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) auto;height:auto;min-height:0;top:80px}.plate figure{aspect-ratio:4/3}}

/* archive */
.arch{padding-block:clamp(60px,9vw,130px)}
.tabs{display:flex;gap:0;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:999px;width:max-content;max-width:100%;overflow:hidden}
.tabs button{min-height:44px;padding:0 18px;border:0;background:none;cursor:pointer;font:700 14px var(--fd);color:var(--ink);transition:.3s}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px;margin-top:30px}
.tile{all:unset;cursor:pointer;display:block}
.tile figure{margin:0;aspect-ratio:4/5;overflow:hidden;border-radius:6px;position:relative;clip-path:inset(0 0 0 0 round 6px);transition:clip-path .6s cubic-bezier(.7,0,.2,1)}
.tile:hover figure{clip-path:inset(4% 4% 4% 4% round 14px)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.12)}
.tile .cp{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--ink);margin-top:12px}
.tile b{font:800 17px var(--fd);direction:ltr}
.tile small{color:var(--mute);font-size:14px}
.tile:focus-visible figure{outline:2px solid var(--mag);outline-offset:3px}
.tile[hidden]{display:none}
@media(max-width:1000px){.ag{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.ag{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* essay */
.essay{background:var(--ink);color:var(--paper);padding-block:clamp(70px,10vw,150px)}
.essay .sec{border-color:rgba(255,255,255,.3)}.essay .sec p{color:#bba9b1}
.eg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px)}
.quote{font-family:var(--fs);font-size:clamp(28px,3.4vw,50px);line-height:1.2;margin:0;position:relative}
[dir=rtl] .quote{line-height:1.7;font-size:clamp(24px,2.8vw,40px)}
.quote .sv-wi{opacity:.18}
.quote::before{content:"“";position:absolute;inset-inline-start:-.1em;top:-.55em;font-size:3em;color:var(--mag);line-height:1}
.drop::first-letter{float:inline-start;font:900 4.4em/.8 var(--fd);margin-inline-end:.08em;margin-top:.06em;color:#ff3370}
[dir=rtl] .drop::first-letter{float:none;font:inherit;margin:0;color:inherit}
.essay p.drop{color:#d8cbd1;margin-top:0}
.lrow{display:grid;gap:16px;margin-top:34px}
.lrow div{display:grid;grid-template-columns:6.5em minmax(0,1fr) 5.5em;gap:16px;align-items:center;font:700 15px var(--fd)}
.lrow em{font-size:15px;color:#bba9b1;text-align:end}
.lrow .bar{height:2px;background:rgba(255,255,255,.2);position:relative}
.lrow .bar i{position:absolute;inset-block:0;inset-inline-start:0;background:#ff3370;width:0}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.3);margin-top:clamp(50px,7vw,90px)}
.nums div{padding:24px 0}
.nums b{display:block;font:900 clamp(48px,7vw,110px)/1 "Inter Tight",sans-serif;letter-spacing:-.05em;direction:ltr;text-align:start}
.nums span{color:#bba9b1;font-size:15px}
@media(max-width:860px){.eg{grid-template-columns:minmax(0,1fr)}}

/* services accordion */
.svc{padding-block:clamp(70px,10vw,140px)}
.acc{border-top:1.5px solid var(--ink)}
.ac{border-bottom:1px solid var(--line)}
.ac button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:16px;align-items:center;padding:22px 0;cursor:pointer}
.ac h3{font-size:clamp(26px,3.6vw,54px);letter-spacing:-.03em;transition:color .3s,transform .5s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .ac h3{letter-spacing:0}
.ac button:hover h3{color:var(--mag);transform:translateX(calc(var(--d,1)*14px))}
[dir=rtl] .ac{--d:-1}
.ac .pm{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);position:relative;transition:transform .5s,background .3s}
.ac .pm::before,.ac .pm::after{content:"";position:absolute;inset:50% 13px auto;height:1.5px;background:currentColor;margin-top:-.75px}
.ac .pm::after{transform:rotate(90deg);transition:transform .4s}
.ac.open .pm{transform:rotate(180deg);background:var(--ink);color:var(--paper)}.ac.open .pm::after{transform:rotate(0)}
.ac .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.7,0,.2,1)}
.ac.open .body{grid-template-rows:1fr}
.ac .body>div{overflow:hidden}
.ac .body p{margin:0 0 24px;max-width:56ch;font-family:var(--fs);font-size:22px;color:var(--mute)}
[dir=rtl] .ac .body p{font-size:19px}
.ac button:focus-visible{outline:2px solid var(--mag);outline-offset:4px}
.proc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:60px}
.proc div{border-top:1.5px solid var(--ink);padding-top:14px}
.proc b{font:800 19px var(--fd);display:block}.proc p{margin:4px 0 0;color:var(--mute);font-size:15px}
@media(max-width:800px){.proc{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* colophon */
.colo{background:var(--mag);color:#fff;padding-block:clamp(70px,10vw,140px) 0;position:relative;overflow:hidden}
.colo h2{font-size:clamp(48px,9vw,150px);letter-spacing:-.05em;line-height:.9}
[dir=rtl] .colo h2{letter-spacing:0;line-height:1.3;font-size:clamp(40px,6.5vw,104px)}
.colo h2 .sv-c{display:inline-block;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.colo h2.ready .sv-c:hover{transform:translateY(-.12em) rotate(-6deg)}
.cg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);margin-top:50px}
.cg .lead{font-family:var(--fs);font-size:24px;line-height:1.4;margin:0 0 26px}
[dir=rtl] .cg .lead{font-size:20px;line-height:1.8}
.soc{border-top:1px solid rgba(255,255,255,.4)}
.soc a{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.4);text-decoration:none;font:700 18px var(--fd);transition:padding .4s}
.soc a:hover{padding-inline-start:14px}
.soc svg{width:22px;height:22px}.soc small{margin-inline-start:auto;font:400 14px var(--fb);opacity:.85}
form{background:var(--paper);color:var(--ink);border-radius:20px;padding:clamp(22px,3vw,34px);display:grid;gap:14px;align-self:start}
form h3{font-size:26px;letter-spacing:-.02em}
label{display:grid;gap:6px;font:700 14px var(--fd)}
input,select,textarea{font:inherit;font-size:16px;color:inherit;background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:10px 0;min-height:46px;width:100%;border-radius:0;transition:border-color .3s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--mag)}
textarea{min-height:90px;resize:vertical}
form small{color:var(--mute)}
.giant{font:900 clamp(80px,22vw,380px)/.78 "Inter Tight",sans-serif;letter-spacing:-.06em;white-space:nowrap;margin-top:clamp(50px,7vw,100px);direction:ltr;color:#fff;opacity:.95;transform:translateY(12%)}
@media(max-width:860px){.cg{grid-template-columns:minmax(0,1fr)}}
footer{padding:26px max(4vw,18px);background:var(--bg)}
.up{opacity:0;transform:translateY(40px)}
@media(prefers-reduced-motion:reduce){.up{opacity:1;transform:none}.quote .sv-wi{opacity:1}.curtain{display:none}}
</style>
</head>

 ku:{issue:'ژمارەی تایبەت · ٢٠٢٦',issueLong:'پۆرتفۆلیۆ — ژمارەی تایبەت',the:'',z1:'براند',z2:'بە وێنە',z3:'دەگێڕدرێتەوە',featT:'لاپەڕە سەرەکییەکان',archT:'ئەرشیف',servL:'هەر خزمەتگوزارییەک بکەرەوە بۆ زانیاری زیاتر.'},
 en:{issue:'Special issue · 2026',issueLong:'Portfolio — Special issue',the:'the',z1:'Brands,',z2:'told',z3:'visually.',featT:'Features',archT:'Archive',servL:'Open any service to read more.'},
 ar:{issue:'عدد خاص · ٢٠٢٦',issueLong:'بورتفوليو — عدد خاص',the:'',z1:'علامات',z2:'تُروى',z3:'بالصورة',featT:'المواضيع الرئيسية',archT:'الأرشيف',servL:'افتح أي خدمة لمعرفة المزيد.'}
});
$('#lang').innerHTML=S.langSwitch();S.bindLang();
$('#waTop').insertAdjacentHTML('afterbegin',S.ICON.WhatsApp);
$('#soc').innerHTML=S.socials();
S.footer($('#foot'),'light');S.brief($('#brief'));
const V=S.viewer();let F='all',openAc=0;
const FEAT=[0,2,4,1,6,12];
$('#stack').innerHTML=FEAT.map((i,k)=>{const p=P[i];return `<article class="plate"><figure><img src="../assets/work/${p[0]}.webp" alt="${p[1]}" loading="lazy"></figure><div class="tx"><div class="no"><span dir="ltr">${String(k+1).padStart(2,'0')} / ${String(FEAT.length).padStart(2,'0')}</span><span class="cy" data-c="${p[2]}"></span></div><div><h3>${p[1]}</h3><p class="cat serif" data-n="${i}"></p></div><button class="btn open" data-n="${i}"><span class="vw"></span>${S.ICON.arrow}</button></div></article>`}).join('');
$('#ag').innerHTML=P.map((p,i)=>`<button class="tile up" data-n="${i}" data-c="${p[2]}"><figure><img src="../assets/work/${p[0]}.webp" alt="${p[1]}" loading="lazy"></figure><div class="cp"><b>${p[1]}</b><small></small></div></button>`).join('');
function draw(){
 const L=S.lang;
 document.querySelectorAll('.plate').forEach(pl=>{const n=+pl.querySelector('.cat').dataset.n;pl.querySelector('.cat').textContent=P[n][3][L];pl.querySelector('.cy').textContent=S.CAT[P[n][2]][L];pl.querySelector('.vw').textContent=S.t('view')});
 document.querySelectorAll('.tile').forEach(t=>t.querySelector('small').textContent=S.CAT[P[+t.dataset.n][2]][L]);
 $('#tabs').innerHTML=['all','b','s','p'].map(c=>`<button data-f="${c}" aria-pressed="${c===F}">${S.CAT[c][L]}</button>`).join('');
 $('#acc').innerHTML=S.SERV.map((s,k)=>`<div class="ac${k===openAc?' open':''}"><button aria-expanded="${k===openAc}"><h3>${s[1][L][0]}</h3><span class="pm"></span></button><div class="body"><div><p>${s[1][L][1]}</p></div></div></div>`).join('');
 $('#proc').innerHTML=S.STEPS.map(s=>`<div><b>${s[L][0]}</b><p>${s[L][1]}</p></div>`).join('');
 const k2=$('#k2');k2.lastChild.textContent=L==='en'?'Sherzad':S.t('last');$('#k1').textContent=L==='en'?'Svala':S.t('first');
 k2.querySelector('em').style.display=L==='en'?'':'none';
}
S.on(draw);S.setLang(S.lang);
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;F=b.dataset.f;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.tile').forEach(t=>{const h=F!=='all'&&t.dataset.c!==F;t.hidden=h;if(!h&&G&&!R)G.fromTo(t,{opacity:0,y:30},{opacity:1,y:0,duration:.7,ease:'power3.out'})});window.ScrollTrigger&&ScrollTrigger.refresh()});
$('#acc').addEventListener('click',e=>{const b=e.target.closest('.ac button');if(!b)return;const ac=b.parentElement;const idx=[...ac.parentElement.children].indexOf(ac);openAc=ac.classList.contains('open')?-1:idx;document.querySelectorAll('.ac').forEach((a,k)=>{a.classList.toggle('open',k===openAc);a.querySelector('button').setAttribute('aria-expanded',k===openAc)})});
document.addEventListener('click',e=>{const c=e.target.closest('.tile,.plate .open');if(c)V.open(+c.dataset.n)});
S.magnetic('.btn',.2);
const cur=$('#curtain');

if(G&&window.ScrollTrigger&&!R){
 G.registerPlugin(ScrollTrigger);S.smooth();
 /* curtain intro */
 G.set('#k1,#k2',{yPercent:100,opacity:0});
 const tl=G.timeline({delay:.15});
 tl.to('#curtain i',{scaleY:0,transformOrigin:'50% 0%',duration:1,ease:'expo.inOut',stagger:.07})
   .to('#k1,#k2',{yPercent:0,opacity:1,duration:1.3,ease:'expo.out',stagger:.12},'-=.6')
   .to('.hgrid .up',{opacity:1,y:0,duration:1,stagger:.1,ease:'power3.out'},'-=.9')
   .call(()=>cur.remove());
 /* kinetic name drift */
 G.to('#k1',{xPercent:-12,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
 G.to('#k2',{xPercent:10,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
 /* zoom cover */
 const zt=G.timeline({scrollTrigger:{trigger:'#zoom',start:'top top',end:'+=130%',pin:true,scrub:.8}});
 zt.to('#zimg',{width:'100vw',height:'100svh',borderRadius:0,ease:'power2.inOut'},0)
   .to('#zt span:nth-child(1)',{xPercent:-60,yPercent:-40,ease:'none'},0)
   .to('#zt span:nth-child(3)',{xPercent:60,yPercent:40,ease:'none'},0)
   .to('#zt span:nth-child(2)',{scale:1.15,ease:'none'},0);
 /* stacked plates */
 const plates=G.utils.toArray('.plate');
 plates.forEach((pl,k)=>{
  G.fromTo(pl.querySelector('figure img'),{scale:1.25},{scale:1,ease:'none',scrollTrigger:{trigger:pl,start:'top bottom',end:'top 90px',scrub:true}});
  if(k<plates.length-1)G.to(pl,{scale:.9,opacity:.5,filter:'blur(2px)',ease:'none',scrollTrigger:{trigger:plates[k+1],start:'top bottom',end:'top 90px',scrub:true}});
 });
 /* reveal */
 G.utils.toArray('.sec.up,.tile.up').forEach(e=>G.to(e,{opacity:1,y:0,duration:1.1,ease:'expo.out',scrollTrigger:{trigger:e,start:'top 92%'}}));
 const quote=()=>{const w=S.split($('#quote'),'w');G.to(w,{opacity:1,stagger:.04,ease:'none',scrollTrigger:{trigger:'#quote',start:'top 80%',end:'bottom 50%',scrub:true}})};quote();
 document.querySelectorAll('.lrow .bar i').forEach(i=>G.to(i,{width:i.dataset.w+'%',duration:1.6,ease:'expo.out',scrollTrigger:{trigger:i,start:'top 92%'}}));
 document.querySelectorAll('[data-count]').forEach(b=>{const o={v:+(b.dataset.from||0)};G.to(o,{v:+b.dataset.count,duration:2.2,ease:'power3.out',scrollTrigger:{trigger:b,start:'top 92%'},onUpdate:()=>b.textContent=Math.round(o.v)})});
 const ct=()=>{const h=$('#cT');h.classList.remove('ready');const c=S.split(h);G.from(c,{yPercent:110,rotate:6,duration:1.1,ease:'expo.out',stagger:.02,scrollTrigger:{trigger:h,start:'top 85%'},onComplete:()=>h.classList.add('ready')})};ct();
 G.fromTo('.giant',{xPercent:0},{xPercent:-25,ease:'none',scrollTrigger:{trigger:'.colo',start:'top bottom',end:'bottom top',scrub:true}});
 S.on(()=>{ScrollTrigger.getAll().forEach(t=>{if(t.trigger&&(t.trigger.id==='quote'||t.trigger.id==='cT'))t.kill()});requestAnimationFrame(()=>{quote();ct();ScrollTrigger.refresh()})});
}else{cur.remove();document.querySelectorAll('.up').forEach(e=>{e.style.opacity=1;e.style.transform='none'});document.querySelectorAll('.lrow .bar i').forEach(i=>i.style.width=i.dataset.w+'%')}
}
</script>
